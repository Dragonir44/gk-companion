name: Signaler un bug / Report a bug
description: Quelque chose ne marche pas comme prévu. / Something doesn't work as expected.
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: game
    attributes:
      label: Jeu concerné / Game
      options:
        - Graveyard Keeper
        - Graveyard Keeper 2
        - Les deux / Both
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Partie de l'app / App area
      options:
        - Planificateur (recherche, liste, matériaux) / Planner
        - Arbre de recherche / Research tree
        - Sauvegarde suivie / Save tracking
        - Noms ou icônes / Names or icons
        - Démarrage, détection du jeu / Startup, game detection
        - Mise à jour de l'app / App update
        - Autre / Other
  - type: textarea
    id: what-happened
    attributes:
      label: Que s'est-il passé ? / What happened?
      description: Ce que tu as vu. / What you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qu'attendais-tu ? / What did you expect?
  - type: textarea
    id: steps
    attributes:
      label: Comment le reproduire ? / How to reproduce?
      placeholder: |
        1. Ouvrir GK2, onglet Recherche…
        2. …
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic (rempli par l'app) / Diagnostics (filled by the app)
      description: Rempli automatiquement si tu passes par le bouton de l'app. / Filled automatically when opened from the app.
      render: text
  - type: markdown
    attributes:
      value: |
        Une capture d'écran aide beaucoup : tu peux la coller dans le premier champ. / A screenshot helps a lot: paste it in the first field.
