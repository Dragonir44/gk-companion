# Builds installers for Linux, Windows and macOS when a version tag is
# pushed (git tag v0.1.0 && git push origin v0.1.0), and attaches them to a
# *draft* GitHub release, published by hand after checking it.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          [ "$TAG" = "v$version" ] || { echo "tag $TAG != app version v$version"; exit 1; }
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --title "GK Companion $TAG" --generate-notes

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu: the AppImage runs on distros with a
          # glibc at least this recent.
          - os: ubuntu-22.04
            bundles: appimage,deb,rpm
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - run: npm ci
      - run: npm test

      - name: Build
        shell: bash
        env:
          # linuxdeploy's strip chokes on some newer ELF sections.
          NO_STRIP: "1"
        run: npx tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }}

      - name: Drop bundled libwayland from the AppImage
        if: runner.os == 'Linux'
        run: bash scripts/fix-appimage-wayland.sh

      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob globstar
          files=(
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/nsis/*-setup.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
          )
          [ ${#files[@]} -gt 0 ] || { echo "no bundles found"; exit 1; }
          # Asset names without spaces ("GK Companion_0.1.0" -> "GK-Companion_0.1.0").
          for f in "${files[@]}"; do
            dest="$(dirname "$f")/$(basename "$f" | tr ' ' '-')"
            [ "$f" = "$dest" ] || mv "$f" "$dest"
            gh release upload "$TAG" "$dest" --clobber
          done
