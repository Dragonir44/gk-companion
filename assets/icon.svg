<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2431"/>
      <stop offset="1" stop-color="#141217"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b35e"/>
      <stop offset="1" stop-color="#c47f2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#e2a24f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e2a24f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="200" fill="url(#bg)"/>
  <circle cx="512" cy="450" r="380" fill="url(#glow)"/>
  <!-- ground -->
  <path d="M170 800 Q512 735 854 800 L854 840 Q512 785 170 840 Z" fill="#3a3142"/>
  <!-- tombstone -->
  <path d="M332 790 L332 420 Q332 240 512 240 Q692 240 692 420 L692 790 Z" fill="url(#stone)" stroke="#1d1a22" stroke-width="22" stroke-linejoin="round"/>
  <!-- cross -->
  <rect x="490" y="330" width="44" height="190" rx="10" fill="#1d1a22"/>
  <rect x="440" y="380" width="144" height="44" rx="10" fill="#1d1a22"/>
  <!-- hammer leaning on the stone -->
  <g transform="rotate(-38 640 640)">
    <rect x="620" y="520" width="40" height="300" rx="14" fill="#8a5a2b" stroke="#1d1a22" stroke-width="18"/>
    <rect x="560" y="470" width="160" height="80" rx="16" fill="#b9bcc4" stroke="#1d1a22" stroke-width="18"/>
  </g>
</svg>
